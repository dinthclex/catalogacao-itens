<!-- NOVO (09/09/2026), pedido verbatim: "Ao iniciar o app, mesmo estando
     ativado, pelo botao de swap de apresentacao da interface definido para
     o jeito antigo (nao BSP/dockable), por padrao esta carregando primeiro
     a versao BSP/dockable e depois aparece a versao antiga [...] Implemente
     algum jeito de carregar direto [...] sem essa 'troca ao vivo' ter de
     acontecer." -- script inline, RODA AQUI (antes de qualquer CSS/pintura
     da pagina) porque o motivo do "flash" e que `#app` (raiz do Workspace/
     BSP, ver js/bsplayout.js) fica de pé (nao tem display:none por padrao)
     e e desenhado por `App._boot()` (App.navigate(), ver js/app.js) MUITO
     antes de `ClassicMode.restoreFromSettings()` (js/classicmode.js) saber
     que devia esconder `#app`/mostrar `#classic-shell` no lugar -- essa
     decisao depende de `DB.getSetting('layoutMode')`, que so responde
     depois do IndexedDB abrir (assincrono, sempre depois do 1o paint). A
     `.boot-bar` (ver abaixo) NAO resolve isto: e so uma tira fina no topo,
     nao cobre a tela -- o Workspace nasce visivel por baixo dela mesmo
     assim. Solucao: `js/classicmode.js` espelha `layoutMode` (mesmo valor
     salvo no IndexedDB) tambem em `localStorage['catalogo_layoutMode']`
     (sincrono, disponivel JA na 1a linha de JS, sem esperar banco nenhum)
     -- aqui, so lemos esse espelho e, se for 'classic', marcamos
     `<html class="catalogo-boot-classic">` ANTES da tag <link> da folha de
     estilo (que so entao aplica a regra `html.catalogo-boot-classic #app
     { display:none }` -- ver css/style.css, busca por
     "catalogo-boot-classic") -- ou seja, `#app` nunca chega a ficar visivel
     por nem 1 frame nesses casos. `ClassicMode.restoreFromSettings()`
     remove essa classe (via `_clearBootPrefClass()`) assim que a decisao
     REAL (vinda do banco) é confirmada -- cobre tambem o caso raro do
     espelho estar desatualizado/ausente (1a visita com este script, ou
     `localStorage` limpo manualmente): ai `#app` so fica escondido por um
     instante e reaparece normal, sem nenhum efeito colateral pra quem usa
     o modo BSP (o padrao, sem cache -> sem classe -> comportamento
     IDENTICO a antes, nenhum atraso a mais). -->
<script>(function(){
  try {
    if (localStorage.getItem('catalogo_layoutMode') === 'classic') {
      document.documentElement.classList.add('catalogo-boot-classic');
    }
  } catch (e) { /* localStorage indisponivel (ex.: modo privado) -- segue sem o class, comportamento igual a antes */ }
})();</script>
